version: 2

models:
  - name: int_sales_calls
    description: >
      Completed sales calls. Grain: one row per completed (is_done = true)
      activity whose type is mapped to a funnel step in funnel_step_mapping
      (`meeting` = Sales Call 1, `sc_2` = Sales Call 2). Not-done activities
      are excluded because the call did not take place. `called_at` is the
      activity due timestamp, the only activity time in the source.
      Columns passed through from stg_activity are tested there.
    columns:
      - name: activity_key
        # grain check
        data_tests: [unique]
      - name: activity_id
      - name: deal_id
      - name: user_id
        description: User who held the call.
      - name: activity_type_key
        description: meeting or sc_2, per funnel_step_mapping.
      - name: activity_type_name
        description: '"Sales Call 1" or "Sales Call 2".'
      - name: called_at
