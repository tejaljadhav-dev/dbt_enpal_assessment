version: 2

sources:
  - name: pipedrive
    description: >
      Raw Pipedrive CRM extract loaded from raw_data/*.csv into the local
      Postgres `public` schema by docker-compose (see init.sql / load_data.sh).
      There is no deals table: deals exist only as `deal_id` values in
      `deal_changes` (deal field history) and `activity`.
    database: postgres
    schema: public
    tables:
      - name: deal_changes
        description: >
          Field-level change log for deals. Grain: one row per
          (deal_id, change_time, changed_field_key). Tracked keys are the four
          fields described in `fields`: add_time, user_id, stage_id, lost_reason.
          Every deal starts at stage 1. Five deal_ids contain two `add_time`
          events and two interleaved stage histories; all backward or repeated
          stage moves in the data come from those five deals.
        columns:
          - name: deal_id
            description: Pipedrive deal id the change belongs to.
          - name: change_time
            description: Timestamp of the field change.
          - name: changed_field_key
            description: "Field that changed: add_time, user_id, stage_id or lost_reason."
          - name: new_value
            description: New field value as text (timestamp, user id, stage id or lost-reason option id).

      - name: activity
        description: >
          Pipedrive activities (calls/meetings) linked to deals. `activity_id`
          is NOT unique: 11 ids are reused by unrelated rows (different type,
          user and deal). Only 8 of the ~4.6k activity deal_ids appear in
          `deal_changes`, so activities cannot be relied on to join to the
          stage history.
        columns:
          - name: activity_id
            description: "Pipedrive activity id. Not unique: 11 ids are reused by unrelated rows."
          - name: type
            description: Activity type key; joins to `activity_types.type`.
          - name: assigned_to_user
            description: Id of the user the activity is assigned to; joins to users.id.
          - name: deal_id
            description: Pipedrive deal id the activity belongs to.
          - name: done
            description: True when the activity was marked as done.
          - name: due_to
            description: Due timestamp. The only activity timestamp available; there is no completion time.

      - name: activity_types
        description: "Activity type reference. Grain: one row per activity type."

      - name: stages
        description: "Pipeline stage reference. Grain: one row per stage (9 stages, one pipeline)."

      - name: users
        description: "CRM users (deal owners / activity assignees). Grain: one row per user. Emails are not unique."

      - name: fields
        description: >
          Deal field metadata. Grain: one row per deal field; the four rows are
          exactly the keys tracked in `deal_changes.changed_field_key`.
          `field_value_options` (JSONB) holds option id/label pairs for
          enum fields (stage_id, lost_reason).
