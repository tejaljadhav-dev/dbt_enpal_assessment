version: 2

models:
  - name: dim_activity_type
    description: >
      Activity types with their funnel step where they have one. Grain: one row
      per activity type. Joins to activity_type_key in stg_activity and
      int_sales_calls.
    columns:
      - name: activity_type_id
        data_tests: [unique, not_null]
      - name: activity_type_key
        data_tests: [unique, not_null]
      - name: activity_type_name
        data_tests: [not_null]
      - name: is_active
      - name: is_sales_call
        description: True for the types mapped to a funnel step (Sales Call 1 and Sales Call 2).
        data_tests: [not_null]
      - name: funnel_step
        description: '2.1 or 3.1 for sales calls; null for follow-up and after-close calls.'
      - name: kpi_name
        description: Funnel step name for sales calls; null otherwise.
