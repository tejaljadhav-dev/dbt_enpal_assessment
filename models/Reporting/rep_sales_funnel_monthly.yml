version: 2

models:
  - name: rep_sales_funnel_monthly
    description: >
      Monthly sales funnel. Grain: one row per month, KPI and funnel step.
      `deals_count` is the number of distinct deals that entered the step for
      the first time in that month (see int_funnel_events for the rules).
      Zero-filled: every month from the first to the last funnel event has a
      row for all 11 steps, with deals_count = 0 where no deal entered the step.
      Note the activity extract ends in September 2024 while stage changes run
      to February 2025, so Sales Call 1 / 2 show 0 for October 2024 onwards
      because there is no data, not because no calls happened.
      month, kpi_name and funnel_step come from a month spine crossed with the
      mapping seed, so they cannot be null; only the grain and count are tested.
    columns:
      - name: month
        description: First day of the calendar month of the entry event.
      - name: kpi_name
        description: Funnel step name, e.g. "Qualified Lead", "Sales Call 1".
      - name: funnel_step
        description: Funnel step label ('1', '2', '2.1', '3', '3.1', '4' ... '9').
      - name: deals_count
        description: Distinct deals that entered the step in the month; 0 when none did.
        # required by the assessment brief as an explicit output guarantee
        data_tests: [not_negative]
    data_tests:
      # one row per month and step; a duplicate would double-count in BI
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ['month', 'funnel_step']
